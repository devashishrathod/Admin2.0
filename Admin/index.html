<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trydood Admin Panel</title>
    <meta name="description" content="Trydood internal admin panel." />
    <!-- Internal tool: keep it out of search results -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#09B285" />

    <link rel="icon" type="image/png" href="/src/assets/Icon.png" />
    <link rel="apple-touch-icon" href="/src/assets/Icon.png" />

    <!-- Apply the saved dark theme before first paint so dark-mode users
         don't see a white flash (ThemeContext.jsx takes over after mount). -->
    <script>
      try {
        if (localStorage.getItem('trydood-admin-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- Fonts: Plus Jakarta Sans (UI) + DM Serif Display (headings) —
         the --font-sans / --font-display tokens in src/index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Trydood Admin Panel needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
